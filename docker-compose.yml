version: '3'

services:

  cyanoarenes_backend:
    image: "${BACKEND_IMAGE:?is not set; deploy with ../scripts/deploy-library.sh}"
    environment:
      POSTGRES_SERVER: descriptor_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:?is not set, expected from ../.env.secrets via the .env link in this folder}"
      POSTGRES_DB: cyanoarenes_data
      API_PREFIX: cyanoarenes
    entrypoint: bash prestart.sh
    networks:
      - external_network
      - descriptor-libraries-internal
    labels:
      - traefik.enable=true
      - traefik.http.services.descriptor_libraries-cyanoarenes_backend.loadbalancer.server.port=8080
      - "traefik.http.routers.descriptor_libraries-cyanoarenes_backend.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/api/cyanoarenes`))"
      - traefik.http.routers.descriptor_libraries-cyanoarenes_backend.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-cyanoarenes_backend.tls.certresolver=letsencrypt

  cyanoarenes_frontend:
    image: "${FRONTEND_IMAGE:?is not set; deploy with ../scripts/deploy-library.sh}"
    volumes:
      - "./public:/app/public"
    environment:
      - VITE_BASE_URL=/cyanoarenes
    networks:
      - external_network
    entrypoint: ash renameBase.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.descriptor_libraries-frontend-cyanoarenes.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/cyanoarenes`))"
      - "traefik.http.services.descriptor_libraries-frontend-cyanoarenes.loadbalancer.server.port=3000"
      - traefik.http.routers.descriptor_libraries-frontend-cyanoarenes.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-frontend-cyanoarenes.tls.certresolver=letsencrypt

networks:
  external_network:
    # external = handled outside of this docker compose
    name: docker_main_net
    external: true
  descriptor-libraries-internal:
    external: true
